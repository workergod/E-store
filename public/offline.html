<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryodeal - Offline</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 100%;
    }
    .logo-badge {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 2px solid #3b82f6;
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }
    .logo-badge svg {
      width: 64px;
      height: 64px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .status-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .status-row svg {
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
    }
    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-retry:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .spinning {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .footer-note {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <!-- High-res Cryodeal "C" Emblem -->
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 356 172 A 136 136 0 1 0 356 340" stroke="#ffffff" stroke-width="56" stroke-linecap="round" />
        <circle cx="360" cy="256" r="20" fill="#ef4444" />
      </svg>
    </div>

    <h1 class="brand-title">Cryodeal</h1>

    <div class="status-row">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20"/><path d="M8.5 8.5A6 6 0 0 1 12 8c4 0 7 3 7 7 0 .8-.2 1.6-.5 2.3"/><path d="M5 16.3A5 5 0 0 1 7 7.2"/><path d="M12 12a3 3 0 0 1 3 3"/>
      </svg>
      <span>You're offline</span>
    </div>

    <p class="description">
      No internet connection detected. Cryodeal will automatically reload and resume once your connection is back.
    </p>

    <button id="retryBtn" class="btn-retry" onclick="retryConnection()">
      <svg id="retryIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 16h5v5"/>
      </svg>
      <span id="retryText">Retry Connection</span>
    </button>
  </div>

  <div class="footer-note">Cryodeal Management Platform • Auto-reconnect enabled</div>

  <script>
    // Auto reload when internet comes back
    window.addEventListener('online', () => {
      window.location.reload();
    });

    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const text = document.getElementById('retryText');
      
      icon.classList.add('spinning');
      text.innerText = 'Checking connection...';

      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          setTimeout(() => {
            icon.classList.remove('spinning');
            text.innerText = 'Retry Connection';
          }, 1000);
        });
    }

    // Check periodically in the background
    setInterval(() => {
      if (navigator.onLine) {
        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(() => window.location.reload())
          .catch(() => {});
      }
    }, 5000);
  </script>
</body>
</html>
